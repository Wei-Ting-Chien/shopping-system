spring:
  datasource:
    # ${DB_HOST:postgres} 意思是：嘗試讀取 DB_HOST 環境變數，讀不到就用 'postgres' 當預設值
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:shopping_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  sql:
    init:
      mode: never # 正式環境不自動重建表格，避免資料遺失

logging:
  level:
    com.shopping.system.mapper: ERROR # 正式環境只記錄錯誤