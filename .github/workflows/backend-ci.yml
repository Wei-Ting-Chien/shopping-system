name: Java Backend CI

# 觸發條件：main branches 的 backend 資料夾更動才執行(PR)
on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 執行目錄：Backend
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # 快取 Maven 加速

    # Unit Test，使用 test Env 的 H2 DB 來跑
    - name: Run Unit Tests
      run: mvn test -Dspring.profiles.active=test

    # Build
    - name: Build with Maven
      run: mvn package -DskipTests
